  .aviso.on{animation:estampa 1.1s ease-out}

<script>
/* ================= rodada ================= */
const RODADA={id:"r1",nome:"Rodada 1 · Listas 3 e 4"};
const QUESTOES=[{"n":1,"fase":"facil","cap":"cap. 5","enunciado":"Na convenção do curso, $Q - W = \\Delta U$. Um gás num cilindro-pistão é comprimido pelo pistão enquanto perde calor para o ambiente. Quais são os sinais de $Q$ e de $W$?","alternativas":["$Q > 0$ e $W > 0$","$Q < 0$ e $W < 0$","$Q < 0$ e $W > 0$","$Q > 0$ e $W < 0$"],"correta":1,"dica":"Pergunte-se: o calor entra ou sai do gás? O trabalho é feito pelo gás ou sobre ele?","explicacao":"$Q > 0$ é calor entrando e $W > 0$ é trabalho feito pelo sistema. Calor saindo dá $Q < 0$ e compressão (trabalho feito sobre o gás, $dV < 0$) dá $W < 0$."},{"n":2,"fase":"facil","cap":"cap. 6","enunciado":"Um volume de controle opera em regime permanente com uma entrada e uma saída. Qual afirmação é necessariamente verdadeira?","alternativas":["A velocidade do fluido na entrada é igual à da saída","A vazão volumétrica na entrada é igual à da saída","O estado do fluido na entrada é igual ao da saída","A massa dentro do VC não varia no tempo, logo $\\dot m_e = \\dot m_s$"],"correta":3,"dica":"Regime permanente significa que nada muda com o tempo DENTRO do VC. O que isso implica para $dm_{vc}/dt$?","explicacao":"Em regime permanente $dm_{vc}/dt = 0$, então o que entra de massa sai. Velocidade e vazão volumétrica $\\dot m v$ podem mudar, porque área e volume específico mudam entre entrada e saída."},{"n":3,"fase":"facil","cap":"cap. 5","enunciado":"Um tanque rígido e fechado contendo um gás é aquecido por uma resistência externa (calor atravessa a parede). Para esse processo, o que vale?","alternativas":["$W = 0$ e $Q = \\Delta U$","$W = P\\Delta V$ e $Q = \\Delta H$","$Q = 0$, porque o volume é constante","$W = 0$ e $Q = \\Delta H$"],"correta":0,"dica":"Com volume constante, existe trabalho de fronteira móvel? O que sobra na 1ª lei?","explicacao":"Tanque rígido não tem fronteira móvel, logo $W = \\int P\\,dV = 0$ e a 1ª lei fica $Q = \\Delta U$. $\\Delta H$ só aparece em processos a pressão constante."},{"n":4,"fase":"facil","cap":"cap. 6","enunciado":"Numa válvula de estrangulamento adiabática, com variações de energia cinética e potencial desprezíveis, qual propriedade tem o mesmo valor na entrada e na saída?","alternativas":["A temperatura, para qualquer fluido","A pressão","A entalpia específica: $h_e = h_s$","A energia interna específica: $u_e = u_s$"],"correta":2,"dica":"Aplique a 1ª lei para VC com $\\dot Q = 0$, $\\dot W = 0$ e sem EC e EP. O que resta?","explicacao":"Sem calor, sem trabalho de eixo e sem EC/EP, a 1ª lei reduz a $h_e = h_s$. A pressão cai (é para isso que serve a válvula) e $T$ só se conserva no caso particular de gás ideal."},{"n":5,"fase":"facil","cap":"cap. 5","enunciado":"Um gás ideal se expande isotermicamente num cilindro-pistão, realizando $50\\ \\text{kJ}$ de trabalho sobre o pistão. Qual é o calor trocado?","alternativas":["Não é possível determinar sem conhecer $c_v$","$Q = 0$","$Q = +50\\ \\text{kJ}$ (calor recebido)","$Q = -50\\ \\text{kJ}$ (calor cedido)"],"correta":2,"dica":"Para gás ideal, $u$ depende só de $T$. Quanto vale $\\Delta U$ se $T$ não muda?","explicacao":"Gás ideal isotérmico tem $\\Delta U = m c_v \\Delta T = 0$, então $Q = W = +50\\ \\text{kJ}$. Isotérmico não é adiabático: para manter $T$ constante enquanto realiza trabalho, o gás precisa receber calor."},{"n":6,"fase":"facil","cap":"cap. 6","enunciado":"Na 1ª lei para volume de controle, a energia de cada corrente que entra ou sai usa $h$ em vez de $u$. Por quê?","alternativas":["Porque $h = u + Pv$ inclui o trabalho de fluxo $Pv$ necessário para empurrar a massa através da fronteira","Porque $h$ inclui a energia cinética do escoamento","Porque em regime permanente $u = h$","Porque o fluido dentro do VC está sempre a pressão constante"],"correta":0,"dica":"Para uma porção de massa atravessar a fronteira, o fluido atrás dela precisa empurrá-la. Que trabalho é esse, por unidade de massa?","explicacao":"Empurrar a massa através da fronteira exige o trabalho de fluxo $Pv$ por kg. Somado a $u$, ele forma $h = u + Pv$; a energia cinética continua sendo um termo separado, $V^2/2$."},{"n":7,"fase":"facil","cap":"cap. 5","enunciado":"Água num cilindro-pistão com pistão livre (pressão constante) é aquecida lentamente do estado 1 ao estado 2. Qual expressão dá diretamente o calor $Q$?","alternativas":["$Q = m(u_2 - u_1)$","$Q = m(u_2 - u_1) - P(V_2 - V_1)$","$Q = P(V_2 - V_1)$","$Q = m(h_2 - h_1)$"],"correta":3,"dica":"Escreva $Q = \\Delta U + W$ com $W = P(V_2 - V_1)$ e agrupe $U + PV$.","explicacao":"A pressão constante, $Q = m(u_2 - u_1) + P(V_2 - V_1) = m[(u_2 + Pv_2) - (u_1 + Pv_1)] = m(h_2 - h_1)$. Subtrair o trabalho em vez de somar é o erro de sinal clássico."},{"n":8,"fase":"facil","cap":"cap. 6","enunciado":"No processo de enchimento de um tanque adiabático (inicialmente evacuado) com um gás ideal com calor específico constante, a temperatura final dentro do tanque é menor, maior ou igual à temperatura de alimentação? Pressão e temperatura do gás de entrada são constantes, e a pressão final do tanque é igual à pressão de alimentação.","alternativas":["Igual, porque o tanque é adiabático","Maior, porque $u_2 = h_e$ e portanto $T_2 = k\\,T_e$","Menor, porque o gás se expande ao entrar no tanque","Igual, porque a pressão final é igual à de alimentação"],"correta":1,"dica":"Faça o balanço de energia do tanque com $Q = 0$, $W = 0$ e $m_1 = 0$: $m_2 u_2 = m_e h_e$.","explicacao":"Como $m_2 = m_e$, sai $u_2 = h_e$, ou seja $c_v T_2 = c_p T_e$ e $T_2 = kT_e > T_e$. O trabalho de fluxo $Pv$ da linha vira energia interna dentro do tanque."},{"n":9,"fase":"facil","cap":"cap. 5","enunciado":"Um tanque rígido contém $2\\ \\text{kg}$ de ar, que é aquecido de $300\\ \\text{K}$ para $400\\ \\text{K}$. Use $c_v = 0{,}72\\ \\text{kJ/kg}{\\cdot}\\text{K}$ e $c_p = 1{,}00\\ \\text{kJ/kg}{\\cdot}\\text{K}$. Qual é o calor transferido?","alternativas":["$Q = +144\\ \\text{kJ}$","$Q = -144\\ \\text{kJ}$","$Q = +200\\ \\text{kJ}$","$Q = +0{,}144\\ \\text{kJ}$"],"correta":0,"dica":"Tanque rígido: $W = 0$. Qual calor específico descreve $\\Delta u$?","explicacao":"$Q = \\Delta U = m c_v \\Delta T = 2 \\times 0{,}72 \\times 100 = 144\\ \\text{kJ}$, positivo porque entra. Usar $c_p$ (200 kJ) seria tratar o processo como se fosse a pressão constante."},{"n":10,"fase":"facil","cap":"cap. 6","enunciado":"Uma câmara de mistura em regime permanente recebe $2\\ \\text{kg/s}$ por uma entrada e $3\\ \\text{kg/s}$ por outra. O tubo de saída tem área $A = 0{,}005\\ \\text{m}^2$ e o fluido sai com $v = 0{,}001\\ \\text{m}^3/\\text{kg}$. Qual é a velocidade na saída?","alternativas":["$0{,}6\\ \\text{m/s}$","$0{,}2\\ \\text{m/s}$","$1{,}0\\ \\text{m/s}$","$0{,}4\\ \\text{m/s}$"],"correta":2,"dica":"Primeiro o balanço de massa ($\\dot m_s = ?$), depois $\\dot m = AV/v$.","explicacao":"$\\dot m_s = 2 + 3 = 5\\ \\text{kg/s}$ e $V = \\dot m v / A = 5 \\times 0{,}001 / 0{,}005 = 1{,}0\\ \\text{m/s}$. As outras opções vêm de subtrair as vazões ou usar só uma das entradas."},{"n":11,"fase":"media","cap":"cap. 5","enunciado":"Um chip de silício de $5\\ \\text{mm}$ de lado e $1\\ \\text{mm}$ de espessura está inserido num substrato cerâmico. Em regime permanente, recebe potência elétrica de $0{,}225\\ \\text{W}$. Sua face superior está exposta a um refrigerante a $20\\ ^\\circ\\text{C}$, com $h = 150\\ \\text{W/m}^2\\text{K}$; a condução para o substrato é desprezível. Qual é a temperatura da superfície do chip?","alternativas":["$60\\ ^\\circ\\text{C}$","$20{,}06\\ ^\\circ\\text{C}$","$320\\ ^\\circ\\text{C}$","$80\\ ^\\circ\\text{C}$"],"correta":3,"dica":"Em regime permanente toda a potência elétrica sai por convecção pela face superior: $\\dot W_{el} = hA(T_s - T_\\infty)$. Qual é a área dessa face, em $\\text{m}^2$?","explicacao":"$A = (0{,}005)^2 = 25 \\times 10^{-6}\\ \\text{m}^2$, então $\\Delta T = 0{,}225/(150 \\times 25 \\times 10^{-6}) = 60\\ \\text{K}$ e $T_s = 20 + 60 = 80\\ ^\\circ\\text{C}$. 60 °C é só o $\\Delta T$; 320 °C usa a face lateral."},{"n":12,"fase":"media","cap":"cap. 6","enunciado":"Vapor d'água entra num bocal adiabático a $60\\ \\text{m/s}$ com $h_1 = 3051{,}6\\ \\text{kJ/kg}$ ($u_1 = 2793{,}6\\ \\text{kJ/kg}$) e sai com $h_2 = 2957{,}6\\ \\text{kJ/kg}$ ($u_2 = 2721{,}2\\ \\text{kJ/kg}$). Qual é a velocidade de saída?","alternativas":["$61{,}5\\ \\text{m/s}$","$437{,}7\\ \\text{m/s}$","$385{,}2\\ \\text{m/s}$","$312{,}4\\ \\text{m/s}$"],"correta":1,"dica":"Bocal: sem $\\dot Q$, sem $\\dot W$. A 1ª lei fica $h_1 + V_1^2/2 = h_2 + V_2^2/2$. Cuidado com as unidades de $h$.","explicacao":"$V_2 = \\sqrt{V_1^2 + 2(h_1 - h_2)} = \\sqrt{60^2 + 2 \\times 94{,}0 \\times 1000} = 437{,}7\\ \\text{m/s}$; o fator 1000 converte kJ/kg em J/kg. Usar $u$ em vez de $h$ dá 385,2 m/s e esquecer o 1000 dá 61,5 m/s."},{"n":13,"fase":"media","cap":"cap. 5","enunciado":"Um automóvel de $1275\\ \\text{kg}$ a $60\\ \\text{km/h}$ freia até $20\\ \\text{km/h}$. As pastilhas têm $0{,}5\\ \\text{kg}$ ($c = 1{,}1\\ \\text{kJ/kg}{\\cdot}\\text{K}$) e os discos $4{,}0\\ \\text{kg}$ ($c = 0{,}46\\ \\text{kJ/kg}{\\cdot}\\text{K}$). Admitindo que toda a energia cinética perdida aquece pastilhas e discos, à mesma temperatura, qual é o aumento de temperatura?","alternativas":["$74{,}1\\ ^\\circ\\text{C}$","$853{,}6\\ ^\\circ\\text{C}$","$65{,}9\\ ^\\circ\\text{C}$","$0{,}066\\ ^\\circ\\text{C}$"],"correta":2,"dica":"Calcule $\\Delta EC$ com as velocidades em m/s e iguale a $(m_p c_p + m_d c_d)\\,\\Delta T$.","explicacao":"$\\Delta EC = \\tfrac12 \\cdot 1275 \\cdot (16{,}67^2 - 5{,}56^2) = 157{,}4\\ \\text{kJ}$ e $\\sum mc = 0{,}55 + 1{,}84 = 2{,}39\\ \\text{kJ/K}$, logo $\\Delta T = 65{,}9\\ ^\\circ\\text{C}$. Ignorar a velocidade final dá 74,1 °C."},{"n":14,"fase":"media","cap":"cap. 6","enunciado":"Uma caldeira é alimentada com $5000\\ \\text{kg/h}$ de água a $5\\ \\text{MPa}$ e $20\\ ^\\circ\\text{C}$ ($v = 0{,}0009996\\ \\text{m}^3/\\text{kg}$) e descarrega vapor a $4{,}5\\ \\text{MPa}$ e $450\\ ^\\circ\\text{C}$ ($v = 0{,}07076\\ \\text{m}^3/\\text{kg}$; a $4{,}5\\ \\text{MPa}$, o vapor saturado tem $v_g = 0{,}04406\\ \\text{m}^3/\\text{kg}$). Em regime permanente, qual deve ser a área da seção de descarga para que a velocidade seja $20\\ \\text{m/s}$?","alternativas":["$\\approx 49\\ \\text{cm}^2$","$\\approx 31\\ \\text{cm}^2$","$\\approx 0{,}69\\ \\text{cm}^2$","$\\approx 1{,}8 \\times 10^5\\ \\text{cm}^2$"],"correta":0,"dica":"Converta a vazão para kg/s e use $A = \\dot m v / V$ com o $v$ do estado de saída.","explicacao":"$\\dot m = 5000/3600 = 1{,}389\\ \\text{kg/s}$ e $A = 1{,}389 \\times 0{,}07076/20 = 4{,}91 \\times 10^{-3}\\ \\text{m}^2 \\approx 49\\ \\text{cm}^2$ (a lista arredonda para 50 cm²). O vapor está superaquecido, então $v_g$ não serve; 0,69 cm² é a área da entrada."},{"n":15,"fase":"media","cap":"cap. 5","enunciado":"Ar num cilindro-pistão é comprimido num processo politrópico quase-estático com $n = 1{,}3$, de $P_1 = 100\\ \\text{kPa}$ e $V_1 = 0{,}1\\ \\text{m}^3$ até $V_2 = 0{,}02\\ \\text{m}^3$. Qual é o trabalho realizado pelo ar (convenção: $W > 0$ quando o sistema realiza trabalho)?","alternativas":["$W = -16{,}1\\ \\text{kJ}$","$W = -20{,}7\\ \\text{kJ}$","$W = -8{,}0\\ \\text{kJ}$","$W = +20{,}7\\ \\text{kJ}$"],"correta":1,"dica":"Ache $P_2$ por $P_1V_1^n = P_2V_2^n$ e use $W = \\dfrac{P_2V_2 - P_1V_1}{1 - n}$.","explicacao":"$P_2 = 100 \\times 5^{1{,}3} = 810{,}3\\ \\text{kPa}$, e $W = (810{,}3 \\times 0{,}02 - 100 \\times 0{,}1)/(1 - 1{,}3) = -20{,}7\\ \\text{kJ}$; negativo porque é compressão. −16,1 kJ é a fórmula isotérmica e −8,0 kJ supõe pressão constante."},{"n":16,"fase":"media","cap":"cap. 6","enunciado":"Numa câmara de mistura adiabática a $200\\ \\text{kPa}$, vapor a $200\\ ^\\circ\\text{C}$ ($h = 2870{,}7$; $u = 2654{,}6\\ \\text{kJ/kg}$) se mistura com água líquida a $20\\ ^\\circ\\text{C}$ ($h = 84{,}1$; $u = 83{,}9\\ \\text{kJ/kg}$). A mistura sai a $80\\ ^\\circ\\text{C}$ ($h = 335{,}1$; $u = 334{,}9\\ \\text{kJ/kg}$). Desprezando EC e EP, qual é a razão $\\dot m_{\\text{água fria}}/\\dot m_{\\text{vapor}}$?","alternativas":["$11{,}10$","$0{,}099$","$9{,}24$","$10{,}10$"],"correta":3,"dica":"Escreva $\\dot m_v h_v + \\dot m_a h_a = (\\dot m_v + \\dot m_a) h_s$ e isole $\\dot m_a/\\dot m_v$.","explicacao":"$\\dot m_a/\\dot m_v = (h_v - h_s)/(h_s - h_a) = (2870{,}7 - 335{,}1)/(335{,}1 - 84{,}1) = 10{,}10$. Com $u$ no lugar de $h$ dá 9,24; 11,10 é a razão entre a vazão total e a de vapor."},{"n":17,"fase":"media","cap":"cap. 5","enunciado":"Um tanque rígido e isolado de $0{,}25\\ \\text{m}^3$ contém vapor saturado a $100\\ ^\\circ\\text{C}$ ($v_g = 1{,}6729\\ \\text{m}^3/\\text{kg}$, $u_g = 2506{,}5$, $h_g = 2676{,}1\\ \\text{kJ/kg}$). A água é agitada por uma hélice até $200\\ \\text{kPa}$. No estado final ($200\\ \\text{kPa}$, mesmo $v$), $T \\approx 453\\ ^\\circ\\text{C}$, $u = 3052{,}4$ e $h = 3387{,}0\\ \\text{kJ/kg}$; a $200\\ \\text{kPa}$, $v_g = 0{,}8857\\ \\text{m}^3/\\text{kg}$. Qual é o trabalho $W$ (convenção $Q - W = \\Delta U$)?","alternativas":["$W = -81{,}6\\ \\text{kJ}$","$W = +81{,}6\\ \\text{kJ}$","$W = -106{,}2\\ \\text{kJ}$","$W = -154{,}1\\ \\text{kJ}$"],"correta":0,"dica":"Isolado: $Q = 0$. Rígido: $v$ constante, então a massa sai do estado inicial. O trabalho de hélice entra no sistema.","explicacao":"$m = 0{,}25/1{,}6729 = 0{,}1494\\ \\text{kg}$ e $W = -m(u_2 - u_1) = -0{,}1494 \\times 545{,}9 = -81{,}6\\ \\text{kJ}$ (a lista dá o módulo, 81,58 kJ). Negativo porque o trabalho é feito sobre a água; sistema fechado usa $u$, não $h$."},{"n":18,"fase":"media","cap":"cap. 6","enunciado":"Uma turbina recebe $2\\ \\text{kg/s}$ de vapor a $1\\ \\text{MPa}$ e $350\\ ^\\circ\\text{C}$ ($h = 3157{,}7$; $u = 2875{,}2\\ \\text{kJ/kg}$) a $15\\ \\text{m/s}$ e descarrega vapor saturado a $100\\ \\text{kPa}$ ($h_g = 2675{,}5$; $u_g = 2506{,}1\\ \\text{kJ/kg}$) com velocidade desprezível. Qual é a potência gerada, em regime permanente e adiabática?","alternativas":["$738{,}4\\ \\text{kW}$","$1189{,}4\\ \\text{kW}$","$964{,}6\\ \\text{kW}$","$-964{,}6\\ \\text{kW}$"],"correta":2,"dica":"$\\dot W = \\dot m\\,[(h_1 + V_1^2/2) - h_2]$. Em que unidade está $V_1^2/2$?","explicacao":"$w = 3157{,}7 - 2675{,}5 + 15^2/2000 = 482{,}3\\ \\text{kJ/kg}$ e $\\dot W = 2 \\times 482{,}3 = 964{,}6\\ \\text{kW}$, positivo porque a turbina produz trabalho. Usar $u$ dá 738,4 kW; esquecer o /1000 na EC dá 1189,4 kW."},{"n":19,"fase":"media","cap":"cap. 5","enunciado":"Uma pessoa em repouso transfere cerca de $400\\ \\text{kJ/h}$ de calor ao ambiente. A ventilação de um auditório fechado de $1500\\ \\text{m}^3$, com 100 pessoas, falha. O ar está inicialmente a $300\\ \\text{K}$ e $101\\ \\text{kPa}$ ($R = 0{,}287\\ \\text{kJ/kg}{\\cdot}\\text{K}$, $c_v = 0{,}717$, $c_p = 1{,}004\\ \\text{kJ/kg}{\\cdot}\\text{K}$). Qual é a taxa de aumento da temperatura do ar?","alternativas":["$0{,}38\\ \\text{K/min}$","$31{,}7\\ \\text{K/min}$","$528\\ \\text{K/min}$","$0{,}53\\ \\text{K/min}$"],"correta":3,"dica":"Ache a massa de ar por $PV = mRT$ e use $\\dot Q = m c_v\\, dT/dt$ (volume fixo). Converta tudo para minutos.","explicacao":"$m = 101 \\times 1500/(0{,}287 \\times 300) = 1760\\ \\text{kg}$ e $\\dot Q = 100 \\times 400/60 = 666{,}7\\ \\text{kJ/min}$, logo $dT/dt = 666{,}7/(1760 \\times 0{,}717) = 0{,}53\\ \\text{K/min}$. O auditório tem volume fixo, então vale $c_v$, não $c_p$."},{"n":20,"fase":"media","cap":"cap. 6","enunciado":"Água a $600\\ \\text{kPa}$ e $10\\ ^\\circ\\text{C}$ ($v = 0{,}001\\ \\text{m}^3/\\text{kg}$) escoa num ramal $5\\ \\text{m}$ abaixo do chão. Uma bomba a eleva até o andar superior, $150\\ \\text{m}$ acima do chão, onde a pressão deve ser $200\\ \\text{kPa}$ com vazão de $10\\ \\text{kg/s}$. Escoamento isotérmico, incompressível, EC desprezível, $g = 9{,}81\\ \\text{m/s}^2$. Qual é a potência necessária para acionar a bomba (em módulo)?","alternativas":["$10{,}7\\ \\text{kW}$","$11{,}2\\ \\text{kW}$","$19{,}2\\ \\text{kW}$","$4{,}0\\ \\text{kW}$"],"correta":1,"dica":"Líquido incompressível e isotérmico: $\\Delta h = v\\,\\Delta P$. Some a variação de energia potencial e conte o desnível total.","explicacao":"$-w = v(P_2 - P_1) + g\\Delta z = 0{,}001(200 - 600) + 9{,}81 \\times 155/1000 = 1{,}121\\ \\text{kJ/kg}$, então $|\\dot W| = 10 \\times 1{,}121 = 11{,}2\\ \\text{kW}$. O desnível é $155\\ \\text{m}$ (5 abaixo + 150 acima); ignorar os 5 m dá 10,7 kW."},{"n":21,"fase":"dificil","cap":"cap. 5","enunciado":"Numa pistola de ar comprimido, o reservatório tem $1\\ \\text{cm}^3$ de ar a $27\\ ^\\circ\\text{C}$ e $1\\ \\text{MPa}$. O projétil, de $15\\ \\text{g}$, funciona como pistão travado por um pino. No disparo, o ar se expande isotermicamente e, quando o projétil deixa o cano, a pressão do ar é $0{,}1\\ \\text{MPa}$. A atmosfera está a $101\\ \\text{kPa}$. Qual é a velocidade do projétil na saída do cano?","alternativas":["$0{,}43\\ \\text{m/s}$","$17{,}52\\ \\text{m/s}$","$13{,}63\\ \\text{m/s}$","$13{,}13\\ \\text{m/s}$"],"correta":2,"dica":"Ache $V_2$ pela isoterma, calcule $W_{ar} = P_1V_1\\ln(V_2/V_1)$, desconte o trabalho gasto empurrando a atmosfera e converta o resto em energia cinética.","explicacao":"$V_2 = 10\\ \\text{cm}^3$, $W_{ar} = 10^6 \\cdot 10^{-6} \\ln 10 = 2{,}303\\ \\text{J}$ e $W_{atm} = 101 \\times 10^3 \\times 9 \\times 10^{-6} = 0{,}909\\ \\text{J}$, sobrando $1{,}394\\ \\text{J}$; $V = \\sqrt{2 \\times 1{,}394/0{,}015} = 13{,}63\\ \\text{m/s}$. Esquecer a atmosfera dá 17,52 m/s."},{"n":22,"fase":"dificil","cap":"cap. 6","enunciado":"Um difusor isolado recebe, em regime permanente, ar a $200\\ \\text{m/s}$, $300\\ \\text{K}$ e $100\\ \\text{kPa}$. As áreas de entrada e saída são $100\\ \\text{mm}^2$ e $860\\ \\text{mm}^2$, e o ar sai a $20\\ \\text{m/s}$. Use gás ideal com $R = 0{,}287$, $c_p = 1{,}004$ e $c_v = 0{,}717\\ \\text{kJ/kg}{\\cdot}\\text{K}$. Qual é a pressão na saída?","alternativas":["$123{,}9\\ \\text{kPa}$","$116{,}3\\ \\text{kPa}$","$127{,}0\\ \\text{kPa}$","$108{,}6\\ \\text{kPa}$"],"correta":0,"dica":"Três passos: $\\dot m$ pela entrada; $T_2$ pela 1ª lei com EC; $P_2 = \\dot m R T_2/(A_2V_2)$.","explicacao":"$\\dot m = 100 \\times 10^{-6} \\times 200/(0{,}287 \\times 300) = 0{,}02323\\ \\text{kg/s}$, $T_2 = 300 + (200^2 - 20^2)/(2 \\times 1004) = 319{,}7\\ \\text{K}$ e $P_2 = 0{,}02323 \\times 0{,}287 \\times 319{,}7/(8{,}6 \\times 10^{-4} \\times 20) = 123{,}9\\ \\text{kPa}$. Usar $c_v$ (u no lugar de h) dá 127,0 kPa."},{"n":23,"fase":"dificil","cap":"cap. 5","enunciado":"Um cilindro-pistão contém $0{,}2\\ \\text{kg}$ de ar a $100\\ \\text{kPa}$ e $300\\ \\text{K}$. O pistão só se move com $100\\ \\text{kPa}$. Calor é fornecido: o pistão sobe até encostar nos esbarros, quando o volume é o dobro do inicial; o aquecimento continua com o pistão travado até $250\\ \\text{kPa}$. Com $R = 0{,}287$, $c_v = 0{,}717$ e $c_p = 1{,}004\\ \\text{kJ/kg}{\\cdot}\\text{K}$, qual é o calor total fornecido?","alternativas":["$215{,}1\\ \\text{kJ}$","$154{,}9\\ \\text{kJ}$","$241{,}0\\ \\text{kJ}$","$189{,}3\\ \\text{kJ}$"],"correta":3,"dica":"Ache $T_2$ (P constante, V dobra) e $T_3$ (V constante, P sobe). Só a primeira etapa tem trabalho.","explicacao":"$T_2 = 600\\ \\text{K}$ e $T_3 = 600 \\times 2{,}5 = 1500\\ \\text{K}$; $W = P_1(V_2 - V_1) = mR(T_2 - T_1) = 17{,}2\\ \\text{kJ}$ e $\\Delta U = 0{,}2 \\times 0{,}717 \\times 1200 = 172{,}1\\ \\text{kJ}$, logo $Q = 189{,}3\\ \\text{kJ}$. Usar $c_p$ no processo todo supõe pressão constante do início ao fim."},{"n":24,"fase":"dificil","cap":"cap. 6","enunciado":"Uma turbina adiabática produz $5\\ \\text{MW}$. Vapor entra a $3\\ \\text{MPa}$ e $400\\ ^\\circ\\text{C}$ ($h = 3231{,}7\\ \\text{kJ/kg}$) e sai a $50\\ \\text{kPa}$ com título $0{,}95$ ($h_f = 340{,}5$, $h_{fg} = 2304{,}7$, $h_g = 2645{,}2\\ \\text{kJ/kg}$). O vapor vai a um condensador e sai como líquido saturado a $50\\ \\text{kPa}$. A água de resfriamento entra a $15\\ ^\\circ\\text{C}$ ($h = 63{,}0$) e sai a $25\\ ^\\circ\\text{C}$ ($h = 104{,}9\\ \\text{kJ/kg}$). Desprezando EC e EP, qual é a vazão de água de resfriamento?","alternativas":["$468{,}9\\ \\text{kg/s}$","$372{,}3\\ \\text{kg/s}$","$0{,}372\\ \\text{kg/s}$","$491{,}7\\ \\text{kg/s}$"],"correta":1,"dica":"Sequência: $h$ na saída da turbina pela mistura, vazão de vapor por $\\dot W = \\dot m(h_1 - h_2)$, calor do condensador $\\dot m(h_2 - h_f)$ e, por fim, a água de resfriamento.","explicacao":"$h_2 = 340{,}5 + 0{,}95 \\times 2304{,}7 = 2530{,}0$, $\\dot m_v = 5000/701{,}7 = 7{,}125\\ \\text{kg/s}$, $\\dot Q_c = 7{,}125 \\times 2189{,}5 = 15{,}6\\ \\text{MW}$ e $\\dot m_a = 15600/41{,}9 = 372{,}3\\ \\text{kg/s}$. Usar $h_g$ em vez do $h$ da mistura dá 468,9 kg/s."},{"n":25,"fase":"dificil","cap":"cap. 5","enunciado":"Um reator de $1\\ \\text{m}^3$ contém água a $20\\ \\text{MPa}$ e $360\\ ^\\circ\\text{C}$ (líquido comprimido: $v = 0{,}001823\\ \\text{m}^3/\\text{kg}$, $u = 1702{,}8$, $h = 1739{,}3\\ \\text{kJ/kg}$) dentro de um vaso de contenção isolado e inicialmente evacuado. O reator se rompe. A $200\\ \\text{kPa}$: $v_f = 0{,}001061$, $v_g = 0{,}88573\\ \\text{m}^3/\\text{kg}$, $u_f = 504{,}47$, $u_{fg} = 2025{,}02$, $h_f = 504{,}68$, $h_{fg} = 2201{,}96\\ \\text{kJ/kg}$. Qual deve ser o volume do vaso para que a pressão final seja $200\\ \\text{kPa}$?","alternativas":["$287{,}7\\ \\text{m}^3$","$485{,}9\\ \\text{m}^3$","$272{,}7\\ \\text{m}^3$","$264{,}7\\ \\text{m}^3$"],"correta":0,"dica":"Expansão contra o vácuo num vaso isolado: $Q = 0$ e $W = 0$. Então qual propriedade se conserva? Com ela e $P_2$, ache o título e $v_2$.","explicacao":"$m = 1/0{,}001823 = 548{,}5\\ \\text{kg}$; $u_2 = u_1$ dá $x_2 = (1702{,}8 - 504{,}47)/2025{,}02 = 0{,}5918$ e $v_2 = 0{,}5246\\ \\text{m}^3/\\text{kg}$, logo $V = 287{,}7\\ \\text{m}^3$. Usar $v_g$ (485,9) ignora que o estado final é mistura."},{"n":26,"fase":"dificil","cap":"cap. 6","enunciado":"Um tanque rígido de aço de $1\\ \\text{m}^3$ e $40\\ \\text{kg}$ ($c_{\\text{aço}} = 0{ a}$: $v_f = 0{,}001061$, $v_g = 0{,}88573\\ \\text{m}^3/\\text{kg}$, $u_f = 504{,}47$, $u_{fg} = 2025{,}02$, $h_f = 504{,}68$, $h_{fg} = 2201{,}96\\ \\text{kJ/kg}$. A $600\\ \\text{kPa}$: $v_g = 0{,}3157$; superaquecido a $400\\ ^\\circ\\text{C}$: $v = 0{,}5137$, $u = 2962{,}5$, $h = 3270{,}8$; a $500\\ ^\\circ\\text{C}$: $v = 0{,}5920$, $u = 3128{,}2$, $h = 3483{,}4$. Qual é o calor total fornecido?","alternativas":["$\\approx 4049\\ \\text{kJ}$","$\\approx 4619\\ \\text{kJ}$","$\\approx 4334\\ \\text{kJ}$","$\\approx 4762\\ \\text{kJ}$"],"correta":2,"dica":"Ache $v_1$ e $u_1$ pelo título; $v_3 = 3v_1$ a 600 kPa: compare com $v_g$ e interpole $u_3$ em $v$. O trabalho só ocorre na etapa a 200 kPa.","explicacao":"$v_1 = 0{,}1780$ e $u_1 = 909{,}5$; $v_3 = 0{,}5340 > v_g$, então é superaquecido e $u_3 \\approx 3005{,}4\\ \\text{kJ/kg}$ ($T \\approx 426\\ ^\\circ\\text{C}$). $W = 200 \\times 2 \\times 0{,}356 = 142{,}4\\ \\text{kJ}$ e $Q = 2(3005{,}4 - 909{,}5) + 142{,}4 \\approx 4334\\ \\text{kJ}$. Calcular $W$ com 600 kPa dá 4619 kJ."},{"n":30,"fase":"dificil","cap":"cap. 6","enunciado":"Um tanque de $200\\ \\text{L}$ contém água a $100\\ \\text{kPa}$ com título $1\\%$. Calor é transferido e, quando a pressão atinge $2\\ \\text{MPa}$, a válvula de segurança abre e deixa sair vapor saturado a $2\\ \\text{MPa}$. O processo continua a $2\\ \\text{MPa}$ até o título ser $0{,}9$. A $100\\ \\text{kPa}$: $v_f = 0{,}001043$, $v_g = 1{,}69400\\ \\text{m}^3/\\text{kg}$, $u_f = 417{,}33$, $u_{fg} = 2088{,}72\\ \\text{kJ/kg}$. A $2\\ \\text{MPa}$: $v_f = 0{,}001177$, $v_g = 0{,}09963\\ \\text{m}^3/\\text{kg}$, $u_f = 906{,}42$, $u_{fg} = 1693{,}84$, $u_g = 2600{,}26$, $h_g = 2799{,}51\\ \\text{kJ/kg}$. Qual é o calor total transferido à água?","alternativas":["$25{,}46\\ \\text{MJ}$","$25{,}46\\ \\text{kJ}$","$23{,}68\\ \\text{MJ}$","$-24{,}38\\ \\text{MJ}$"],"correta":0,"dica":"Ache $m_1$ e $m_2$ pelos títulos ($m = V/v$), $m_s = m_1 - m_2$, e aplique $Q = m_2u_2 - m_1u_1 + m_s h_s$, com o vapor saindo saturado.","explicacao":"$m_1 = 11{,}13$ e $m_2 = 2{,}228\\ \\text{kg}$, logo $m_s = 8{,}90\\ \\text{kg}$; $Q = 2{,}228 \\times 2430{,}9 - 11{,}13 \\times 438{,}2 + 8{,}90 \\times 2799{,}5 = 25{,}46\\ \\text{MJ}$. A massa que sai carrega $h_g$; usar $u_g$ dá 23,68 MJ."}];

function girar(){
  if(girando||pote<=0)return;girando=true;['ba','bg','bt','sl'].forEach(i=>$(i).disabled=true);$('luzes').classList.add('luz');
  const m=multDoSlider(+$('sl').value),c=chanceDe(m),alvo=Math.random()*360,ganhou=alvo<c*3.6,fim=(3+Math.floor(Math.random()*2))*360+alvo;
  const dur=matchMedia('(prefers-reduced-motion:reduce)').matches?400:6800,t0=performance.now();let ultimo=-1;const ag=$('agulha');
  /* arranca em 0,4 s e depois desacelera por quase 6 s, com rastejo final */
  const ease=k=>{const a=Math.min(1,k/.06),ini=a*a*.02;const kk=Math.max(0,(k-.06)/.94);return Math.min(1,ini+(1-.02)*(1-Math.pow(1-kk,3.2)));};
  (function passo(t){const k=Math.min(1,(t-t0)/dur),e=ease(k),ang=fim*e;ag.style.transform=`rotate(${ang}deg)`;const fatia=Math.floor(ang/10);if(fatia!==ultimo){ultimo=fatia;if(k<.995)bip(900-300*e,.035,'square',.035);}if(k<1)requestAnimationFrame(passo);else resolver(ganhou,m);})(t0);
}
function resolver(ganhou,m){
  girando=false;
  if(ganhou){pote=Math.round(pote*m);partida.banca+=pote;pote=0;jackpot();tremer();clarao('rgba(39,195,106,.85)');confete(140);setTimeout(()=>confete(120),450);setTimeout(()=>chuva(90),900);estampa('VERDE!','#27C36A');setTimeout(()=>{pintarPainel();avancar();},2300);}
  else{pote=0;chiado();tremer();clarao('rgba(216,35,63,.85)');estampa('VERMELHO','#D8233F');setTimeout(()=>{pintarPainel();partida.banca<=0?fimPartida(true):avancar();},1100);}
}

/* ================= fim ================= */
async function fimPartida(faliu){
  const final=faliu?0:partida.banca,oficial=partida.oficial;
  stats.partidas++;if(oficial)stats.primeira=final;stats.melhor=stats.melhor==null?final:Math.max(stats.melhor,final);
  await Dados.salvarStats(stats);await Dados.apagarPartida();await Dados.publicar();
  trocarPat(LOBBY);partida=null;pintarPainel();
  if(!faliu&&final>INICIAL){jackpot();confete(140);setTimeout(()=>chuva(80),700);}
  palco.innerHTML=`<div class="cartao"><span class="tag">${faliu?'banca zerada':'partida completa'}</span>
    <div class="titulo">${faliu?'A casa levou tudo.':fmt(final)+' bar'}</div>
    <p class="nota" style="font-size:15px">${oficial?'Essa era sua partida oficial: é esse valor que vai para o ranking.':'Partida de treino — conta só como melhor marca.'}</p>
    <button class="acao ouro-btn" style="width:100%;margin-top:12px" id="ini">Ver o ranking</button></div>`;
  $('ini').onclick=telaCapa;
}

/* ================= controles ================= */
$('bsom').onclick=e=>{som=!som;e.target.classList.toggle('on',som);if(som)bip(700,.1);};
$('bmus').onclick=e=>{musica=!musica;e.target.classList.toggle('on',musica);musica?tocar():parar();};
$('brk').onclick=async()=>{if(girando||!partida)return;const volta=partida.idx%10===0&&!partida.faseVista?telaFase:telaPergunta;
  palco.innerHTML=`<div class="cartao"><span class="tag">ranking da sala</span><ul class="rk" id="lista"><li style="grid-template-columns:1fr">carregando…</li></ul><button class="acao guardar" style="width:100%;margin-top:14px" id="v">Voltar à partida</button></div>`;
  $('v').onclick=volta;const lista=await Dados.ranking();if(!$('lista'))return;
  $('lista').innerHTML=listaRanking(lista);};
carregar();
</script>
